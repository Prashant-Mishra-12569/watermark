<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="t d">
  <title id="t">Where card data goes</title>
  <desc id="d">Card data is read over NFC by the phone, which checks and encrypts it. The prover opens it in memory only and wipes it. The chain only gets the proof, a one-way card ID, the wallet and a month.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#0a0a0a"/>
    </marker>
  </defs>
  <rect width="1200" height="260" rx="24" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="40" y="52" font-size="22" font-weight="700" fill="#0a0a0a">Where card data goes</text>
    <text x="40" y="78" font-size="14" fill="#6b6b6b">It gets smaller at every step. Only a proof reaches the chain.</text>

    <rect x="40" y="108" width="220" height="112" rx="16" fill="#f5f5f3"/>
    <text x="60" y="144" font-size="16" font-weight="700" fill="#0a0a0a">Bank card</text>
    <text x="60" y="170" font-size="13" fill="#6b6b6b">Certificates and a</text>
    <text x="60" y="190" font-size="13" fill="#6b6b6b">one-time signature</text>

    <rect x="330" y="108" width="240" height="112" rx="16" fill="#f5f5f3"/>
    <text x="350" y="144" font-size="16" font-weight="700" fill="#0a0a0a">Your phone</text>
    <text x="350" y="170" font-size="13" fill="#6b6b6b">Checks the card, then</text>
    <text x="350" y="190" font-size="13" fill="#6b6b6b">encrypts it for the prover</text>

    <rect x="640" y="108" width="240" height="112" rx="16" fill="#f5f5f3"/>
    <text x="660" y="144" font-size="16" font-weight="700" fill="#0a0a0a">Prover</text>
    <text x="660" y="170" font-size="13" fill="#6b6b6b">Opens it in memory only,</text>
    <text x="660" y="190" font-size="13" fill="#6b6b6b">proves, then wipes it</text>

    <rect x="950" y="108" width="210" height="112" rx="16" fill="#0a0a0a"/>
    <text x="970" y="144" font-size="16" font-weight="700" fill="#fff">On-chain</text>
    <text x="970" y="170" font-size="13" fill="#b5b5b5">Proof, one-way card ID,</text>
    <text x="970" y="190" font-size="13" fill="#b5b5b5">wallet and a month only</text>

    <g stroke="#0a0a0a" stroke-width="2" marker-end="url(#a)">
      <line x1="262" y1="164" x2="326" y2="164"/>
      <line x1="572" y1="164" x2="636" y2="164"/>
      <line x1="882" y1="164" x2="946" y2="164"/>
    </g>
    <g font-size="11" fill="#6b6b6b" text-anchor="middle">
      <text x="294" y="152">NFC</text>
      <text x="604" y="152">RSA + AES</text>
      <text x="914" y="152">ZK proof</text>
    </g>
  </g>
</svg>
