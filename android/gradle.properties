# Session signers the Tap app trusts (interfaces F1), comma-separated.
# 0xf39F…2266 is the PUBLIC dev signer (Anvil account #0): anyone can sign with it, so only debug builds trust it.
# 0x9A06…FdBB is the relayer's real session signer, from its /health (its key lives only in the relayer's .env).
watermark.sessionSigners.debug=0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266,0x9A0606E26646643604b5A334a261527065AaFdBB
watermark.sessionSigners.real=0x9A0606E26646643604b5A334a261527065AaFdBB
