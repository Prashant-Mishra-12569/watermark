name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    name: no secrets or card data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block card-number-like digit runs and private keys
        run: |
          set -e
          # Bounded by non-alphanumerics, so hex addresses and EMV AIDs (A000000524...) don't trigger it
          # The saved alt mempool record is raw JSON from the devnet: its 13-digit numbers are millisecond timestamps.
          if git grep -nE '(^|[^0-9A-Za-z])[0-9]{13,19}([^0-9A-Za-z]|$)' -- ':!*.pdf' ':!pnpm-lock.yaml' ':!*.svg' ':!docs/evidence/altmempool-tx-admission-record.json'; then
            echo "::error::Found a 13-19 digit run. Card numbers must never be committed."; exit 1
          fi
          if git grep -nE '(PRIVATE_KEY|SECRET|ACCESS_KEY)[A-Z_]*=["'"'"']?(0x)?[0-9a-fA-F]{32,}' -- ':!*.pdf'; then
            echo "::error::Found what looks like a committed key."; exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$|\.jks$|\.keystore$'; then
            echo "::error::Secret file tracked."; exit 1
          fi

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - name: Committed caRoot and rulesRoot match the keys and leaves
        run: node tools/zk/src/roots.ts --check

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      # forge-std is not committed (contracts/lib/ is gitignored: its own tests contain long digit runs the guard blocks)
      - run: forge install foundry-rs/forge-std@v1.17.0 --no-git
      # --sizes fails the job if a contract goes over the 24,576-byte limit
      - run: forge build --sizes
      # Fork tests read the public Whitechain RPC; run them locally (contracts/README.md)
      - run: forge test
        env:
          SKIP_FORK: "true"
