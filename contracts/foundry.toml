[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.30"
# Highest target valid on Whitechain Sepolia (OP Stack Isthmus, Prague)
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = false

[rpc_endpoints]
whitechain = "${WHITECHAIN_RPC}"
devnet = "${ALTMEMPOOL_EXEC_RPC}"

[fmt]
line_length = 120
tab_width = 4
