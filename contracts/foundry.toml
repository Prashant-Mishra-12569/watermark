[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.30"
# Highest target valid on Whitechain Sepolia (OP Stack Isthmus, Prague)
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = false
# Vendored third-party Solidity (vendor/hegota-support/README.md). Imports keep the npm package path.
remappings = ["@forshtat/hegota-support/=vendor/hegota-support/"]
# Deploy.s.sol reads caRoot / rulesRoot from the committed policy files; deployments/ holds F11 output.
# test/fixtures holds the real synthetic-card proofs: RealProofStamp.t.sol, and StampFromFixture.s.sol on the devnet
fs_permissions = [
    { access = "read", path = "../policies" },
    { access = "read", path = "../deployments" },
    { access = "read", path = "./test/fixtures" },
]

[rpc_endpoints]
whitechain = "${WHITECHAIN_RPC}"
devnet = "${ALTMEMPOOL_EXEC_RPC}"

[fmt]
line_length = 120
tab_width = 4
